name: Feature request
description: Suggest an idea or vote for a roadmap item
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The outcome you want, e.g. "only DM people who follow me".
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How do you imagine it working?
  - type: textarea
    id: meta
    attributes:
      label: Meta API notes
      description: If you know which Graph API endpoint or permission this needs, link it here.
